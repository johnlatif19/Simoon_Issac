<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        /* public/styles.css */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #f5f5f5 0%, #e8d5b7 100%);
    color: #2c1810;
    overflow-x: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #d4a373;
}

::-webkit-scrollbar-thumb {
    background: #8b4513;
    border-radius: 5px;
}

/* Navbar */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(44, 24, 16, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    padding: 1rem 0;
    transition: all 0.3s ease;
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.logo-text {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-menu a {
    color: #fff;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
}

.nav-menu a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #ffd700;
    transition: width 0.3s;
}

.nav-menu a:hover::after {
    width: 100%;
}

.nav-toggle {
    display: none;
    cursor: pointer;
}

.nav-toggle span {
    display: block;
    width: 25px;
    height: 3px;
    background: #ffd700;
    margin: 5px 0;
    transition: 0.3s;
}

/* Hero Section */
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(44,24,16,0.7), rgba(0,0,0,0.5));
}

.hero-content {
    text-align: center;
    color: #fff;
    z-index: 1;
    animation: fadeInUp 1s ease;
}

.hero-title {
    font-size: 4rem;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.hero-subtitle {
    font-size: 1.3rem;
    margin-bottom: 2rem;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.cta-button {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.cta-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Sections */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 2rem;
}

.section-title {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 3rem;
    color: #8b4513;
    position: relative;
    display: inline-block;
    width: 100%;
}

.section-title::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
}

/* About Section */
.about-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
}

.about-text h3 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #8b4513;
}

.about-text p {
    line-height: 1.8;
    margin-bottom: 1.5rem;
    color: #2c1810;
}

.achievements {
    display: flex;

    margin-top: 2rem;
}

.achievement {
    text-align: center;
}

.achievement i {
    font-size: 2rem;
    color: #ffd700;
    margin-bottom: 0.5rem;
}

.achievement span {

    font-size: 0.9rem;

}

.about-image img {
    width: 100%;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Tours Section */
.tours {
    background: rgba(255,215,0,0.1);
}

.tours-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));

}

.tour-card {
    background: #fff;
    border-radius: 15px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s;
}

.tour-card:hover {

}

.tour-image img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.tour-info {
    padding: 1.5rem;
}

.tour-info h3 {
    margin-bottom: 1rem;
    color: #8b4513;
}

.tour-details {
    display: flex;
    justify-content: space-between;
    margin: 1rem 0;
    color: #666;
}

.book-btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
    transition: opacity 0.3s;
}

.book-btn:hover {
    opacity: 0.9;
}

/* Portfolio Section */
.portfolio-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
}

.portfolio-text h3 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    color: #8b4513;
}

.portfolio-text ul {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
}

.portfolio-text li {
    padding: 0.5rem 0;
    padding-right: 1.5rem;
    position: relative;
}

.portfolio-text li::before {
    content: '★';
    position: absolute;
    right: 0;
    color: #ffd700;
}

.portfolio-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
}

.portfolio-gallery img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.3s;
}

.portfolio-gallery img:hover {
    transform: scale(1.05);
}

/* Gallery Section */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
}

.gallery-item {
    overflow: hidden;
    border-radius: 10px;
    position: relative;
}

.gallery-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    transition: transform 0.5s;
}

.gallery-item:hover img {
    transform: scale(1.1);
}

/* Testimonials Section */
.testimonials {
    background: linear-gradient(135deg, #2c1810, #8b4513);
    color: #fff;
}

.testimonials-slider {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
}

.testimonial {

}

.testimonial-content i {

}

.testimonial-content p {

}

.client-info strong {

/* Contact Section */
.contact-content {

.contact-info {

}

.contact-info p {
    margin: 1rem 0;

    align-items: center;
    gap: 0.5rem;
}

.contact-info i {
    color: #ffd700;

}

.social-links {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.social-links a {
    color: #2c1810;

}

.social-links a:hover {
    color: #ffd700;
}

.booking-form {

    padding: 2rem;
    border-radius: 15px;

}

.form-group {

.form-group input,

/* WhatsApp Button */

/* Modal */
.modal {

}

/* Dashboard Styles */

.login-header {

}

.login-logo {

.login-btn {

/* Dashboard Styles */

}

.stats-cards {

.stat-card {

/* Animations */

    from {

@keyframes fadeIn {

<body class="dashboard-page">
    <nav class="dashboard-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-text">لوحة التحكم - رحلة في مصر</span>
            </div>
            <button id="logoutBtn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>إدارة الحجوزات</h1>
            <p>إجمالي الحجوزات: <span id="totalBookings">0</span></p>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <i class="fas fa-calendar-check"></i>
                <div class="stat-info">
                    <h3>اليوم</h3>
                    <p id="todayBookings">0</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <div class="stat-info">
                    <h3>هذا الشهر</h3>
                    <p id="monthBookings">0</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <div class="stat-info">
                    <h3>إجمالي العملاء</h3>
                    <p id="totalClients">0</p>
                </div>
            </div>
        </div>

        <div class="bookings-table-container">
            <div class="table-header">
                <h2>قائمة الحجوزات</h2>

                    <input type="text" id="searchInput" placeholder="بحث باسم العميل...">
                    <i class="fas fa-search"></i>
                </div>
            </div>

                <table class="bookings-table" id="bookingsTable">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>رقم الهاتف</th>
                            <th>الجولة</th>
                            <th>تاريخ الحجز</th>
                            <th>الرسالة</th>
                            <th>تاريخ الإنشاء</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <tr><td colspan="8" style="text-align: center;">جاري تحميل البيانات...</td></tr>

    <script>
        // public/dashboard.js
const API_URL = window.location.origin;
let allBookings = [];

// Check authentication
function checkAuth() {
    const token = localStorage.getItem('adminToken');
    if (!token) {
        window.location.href = 'login.html';
        return false;
    }
    return token;
}

// Load bookings
async function loadBookings() {
    const token = checkAuth();
    if (!token) return;

    try {
        const response = await fetch('/api/bookings', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
            return;
        }

        if (response.ok) {
            allBookings = await response.json();
            displayBookings(allBookings);
            updateStats(allBookings);
        } else {
            console.error('Failed to load bookings');
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

// Display bookings in table
function displayBookings(bookings) {
    const tbody = document.getElementById('bookingsTableBody');
    
    if (!tbody) return;

    if (bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">لا توجد حجوزات حالياً</td></tr>';
        return;
    }

    tbody.innerHTML = bookings.map(booking => `
        <tr>
            <td>${escapeHtml(booking.name)}</td>
            <td>${escapeHtml(booking.email)}</td>
            <td>${escapeHtml(booking.phone)}</td>
            <td>${escapeHtml(booking.tour)}</td>
            <td>${formatDate(booking.date)}</td>
            <td>${escapeHtml(booking.message) || '-'}</td>
            <td>${formatDate(booking.createdAt)}</td>
            <td>
                <button class="delete-btn" onclick="deleteBooking('${booking.id}')">
                    <i class="fas fa-trash"></i> حذف
                </button>
            </td>
        </tr>
    `).join('');
}

// Update statistics
function updateStats(bookings) {
    const total = bookings.length;
    const today = new Date().toDateString();
    const todayBookings = bookings.filter(b => new Date(b.createdAt).toDateString() === today).length;
    
    const currentMonth = new Date().getMonth();
    const currentYear = new Date().getFullYear();
    const monthBookings = bookings.filter(b => {
        const date = new Date(b.createdAt);
        return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
    }).length;

    const uniqueClients = new Set(bookings.map(b => b.email)).size;

    document.getElementById('totalBookings').textContent = total;
    document.getElementById('todayBookings').textContent = todayBookings;
    document.getElementById('monthBookings').textContent = monthBookings;
    document.getElementById('totalClients').textContent = uniqueClients;
}

// Delete booking
async function deleteBooking(bookingId) {
    if (!confirm('هل أنت متأكد من حذف هذا الحجز؟')) return;

    const token = checkAuth();
    if (!token) return;

    try {
        const response = await fetch(`/api/bookings/${bookingId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
            return;
        }

        if (response.ok) {
            loadBookings(); // Refresh the list
        } else {
            alert('حدث خطأ في حذف الحجز');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('حدث خطأ في الاتصال بالخادم');
    }
}

// Search functionality
function setupSearch() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allBookings.filter(booking => 
                booking.name.toLowerCase().includes(searchTerm) ||
                booking.email.toLowerCase().includes(searchTerm) ||
                booking.tour.toLowerCase().includes(searchTerm)
            );
            displayBookings(filtered);
        });
    }
}

// Helper functions
function escapeHtml(str) {
    if (!str) return '';
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatDate(dateString) {
    if (!dateString) return '-';
    const date = new Date(dateString);
    return date.toLocaleDateString('ar-EG');
}

// Setup logout button
const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('adminToken');
        window.location.href = 'login.html';
    });
}

// Initialize dashboard
loadBookings();
setupSearch();
