<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <style>
        /* public/styles.css */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #f5f5f5 0%, #e8d5b7 100%);
    color: #2c1810;
    overflow-x: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #d4a373;
}

::-webkit-scrollbar-thumb {
    background: #8b4513;
    border-radius: 5px;
}

/* Navbar */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(44, 24, 16, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    padding: 1rem 0;
    transition: all 0.3s ease;
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.logo-text {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-menu a {
    color: #fff;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
}

.nav-menu a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #ffd700;
    transition: width 0.3s;
}

.nav-menu a:hover::after {
    width: 100%;
}

.nav-toggle {
    display: none;
    cursor: pointer;
}

.nav-toggle span {
    display: block;
    width: 25px;
    height: 3px;
    background: #ffd700;
    margin: 5px 0;
    transition: 0.3s;
}

/* Hero Section */
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(44,24,16,0.7), rgba(0,0,0,0.5));
}

.hero-content {
    text-align: center;
    color: #fff;
    z-index: 1;
    animation: fadeInUp 1s ease;
}

.hero-title {
    font-size: 4rem;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.hero-subtitle {
    font-size: 1.3rem;
    margin-bottom: 2rem;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.cta-button {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.cta-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Sections */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 2rem;
}

.section-title {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 3rem;
    color: #8b4513;
    position: relative;
    display: inline-block;
    width: 100%;
}

.section-title::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
}

/* About Section */
.about-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
}

.about-text h3 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #8b4513;
}

.about-text p {
    line-height: 1.8;
    margin-bottom: 1.5rem;
    color: #2c1810;
}

.achievements {
    display: flex;
    gap: 2rem;
    margin-top: 2rem;
}

.achievement {
    text-align: center;
}

.achievement i {
    font-size: 2rem;
    color: #ffd700;
    margin-bottom: 0.5rem;
}

.achievement span {
    display: block;
    font-size: 0.9rem;
    color: #2c1810;
}

.about-image img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Tours Section */
.tours {
    background: rgba(255,215,0,0.1);
}

.tours-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 2rem;
}

.tour-card {
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s;
}

.tour-card:hover {
    transform: translateY(-10px);
}

.tour-image img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.tour-info {
    padding: 1.5rem;
}

.tour-info h3 {
    margin-bottom: 1rem;
    color: #8b4513;
}

.tour-details {
    display: flex;
    justify-content: space-between;
    margin: 1rem 0;
    color: #666;
}

.book-btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
    transition: opacity 0.3s;
}

.book-btn:hover {
    opacity: 0.9;
}

/* Portfolio Section */
.portfolio-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
}

.portfolio-text h3 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    color: #8b4513;
}

.portfolio-text ul {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
}

.portfolio-text li {
    padding: 0.5rem 0;
    padding-right: 1.5rem;
    position: relative;
}

.portfolio-text li::before {
    content: '★';
    position: absolute;
    right: 0;
    color: #ffd700;
}

.portfolio-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
}

.portfolio-gallery img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.3s;
}

.portfolio-gallery img:hover {
    transform: scale(1.05);
}

/* Gallery Section */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
}

.gallery-item {
    overflow: hidden;
    border-radius: 10px;
    position: relative;
}

.gallery-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    transition: transform 0.5s;
}

.gallery-item:hover img {
    transform: scale(1.1);
}

/* Testimonials Section */
.testimonials {
    background: linear-gradient(135deg, #2c1810, #8b4513);
    color: #fff;
}

.testimonials-slider {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
}

.testimonial {
    background: rgba(255,255,255,0.1);
    padding: 2rem;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

.testimonial-content i {
    font-size: 2rem;
    color: #ffd700;
    margin-bottom: 1rem;
}

.testimonial-content p {
    line-height: 1.6;
    margin-bottom: 1rem;
}

.client-info strong {
    display: block;
    margin-top: 1rem;
}

.rating {
    color: #ffd700;
    margin-top: 0.5rem;
}

/* Contact Section */
.contact-content {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 2rem;
}

.contact-info {
    background: #fff;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.contact-info p {
    margin: 1rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.contact-info i {
    color: #ffd700;
    font-size: 1.2rem;
}

.social-links {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.social-links a {
    color: #2c1810;
    font-size: 1.5rem;
    transition: color 0.3s;
}

.social-links a:hover {
    color: #ffd700;
}

.booking-form {
    background: #fff;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.form-group {
    margin-bottom: 1rem;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-family: 'Cairo', sans-serif;
    transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #ffd700;
}

.submit-btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 1rem;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
    font-size: 1rem;
    transition: opacity 0.3s;
}

.submit-btn:hover {
    opacity: 0.9;
}

/* WhatsApp Button */
.whatsapp-btn {
    position: fixed;
    bottom: 30px;
    left: 30px;
    background: #25D366;
    color: #fff;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s;
    z-index: 1000;
}

.whatsapp-btn:hover {
    transform: scale(1.1);
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    animation: fadeIn 0.3s;
}

.modal-content {
    background: #fff;
    margin: 5% auto;
    padding: 2rem;
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
    position: relative;
    animation: slideIn 0.3s;
}

.close {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 2rem;
    cursor: pointer;
    color: #666;
}

.close:hover {
    color: #000;
}

/* Dashboard Styles */
.login-page {
    background: linear-gradient(135deg, #2c1810, #8b4513);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-container {
    width: 100%;
    max-width: 400px;
    padding: 2rem;
}

.login-card {
    background: #fff;
    border-radius: 15px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.login-header {
    text-align: center;
    margin-bottom: 2rem;
}

.login-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin-bottom: 1rem;
}

.login-btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #2c1810;
    border: none;
    padding: 1rem;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
    font-size: 1rem;
}

.error-message {
    background: #f44336;
    color: #fff;
    padding: 0.5rem;
    border-radius: 5px;
    margin-top: 1rem;
    text-align: center;
}

/* Dashboard Styles */
.dashboard-page {
    background: #f5f5f5;
}

.dashboard-nav {
    background: #2c1810;
    padding: 1rem 0;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
}

.dashboard-container {
    margin-top: 80px;
    padding: 2rem;
}

.dashboard-header {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    padding: 2rem;
    border-radius: 15px;
    margin-bottom: 2rem;
    color: #2c1810;
}

.stats-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: #fff;
    padding: 1.5rem;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.stat-card i {
    font-size: 2.5rem;
    color: #ffd700;
}

.stat-info h3 {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 0.5rem;
}

.stat-info p {
    font-size: 1.8rem;
    font-weight: bold;
    color: #2c1810;
}

.bookings-table-container {
    background: #fff;
    border-radius: 15px;
    padding: 1.5rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.search-box {
    position: relative;
}

.search-box input {
    padding: 0.5rem 2rem 0.5rem 1rem;
    border: 1px solid #ddd;
    border-radius: 25px;
    width: 250px;
}

.search-box i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
}

.table-responsive {
    overflow-x: auto;
}

.bookings-table {
    width: 100%;
    border-collapse: collapse;
}

.bookings-table th,
.bookings-table td {
    padding: 1rem;
    text-align: right;
    border-bottom: 1px solid #ddd;
}

.bookings-table th {
    background: #f5f5f5;
    font-weight: 600;
    color: #2c1810;
}

.bookings-table tr:hover {
    background: #f9f9f9;
}

.delete-btn {
    background: #f44336;
    color: #fff;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: opacity 0.3s;
}

.delete-btn:hover {
    opacity: 0.8;
}

.logout-btn {
    background: #f44336;
    color: #fff;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

/* Animations */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes slideIn {
    from {
        transform: translateY(-100px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .nav-toggle {
        display: block;
    }

    .nav-menu {
        position: fixed;
        right: -100%;
        top: 70px;
        flex-direction: column;
        background: rgba(44,24,16,0.95);
        width: 100%;
        text-align: center;
        transition: 0.3s;
        padding: 2rem 0;
    }

    .nav-menu.active {
        right: 0;
    }

    .hero-title {
        font-size: 2rem;
    }

    .hero-subtitle {
        font-size: 1rem;
    }

    .about-content,
    .portfolio-content,
    .contact-content {
        grid-template-columns: 1fr;
    }

    .section-title {
        font-size: 1.8rem;
    }

    .stats-cards {
        grid-template-columns: 1fr;
    }

    .table-header {
        flex-direction: column;
    }

    .search-box input {
        width: 100%;
    }

    .bookings-table th,
    .bookings-table td {
        font-size: 0.8rem;
        padding: 0.5rem;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 2rem 1rem;
    }

    .tours-grid {
        grid-template-columns: 1fr;
    }

    .achievements {
        flex-direction: column;
        gap: 1rem;
    }
}

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://via.placeholder.com/80x80?text=Logo" alt="Logo" class="login-logo">
                <h2>تسجيل الدخول إلى لوحة التحكم</h2>
                <p>الرجاء إدخال بيانات الاعتماد الخاصة بك</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="login-btn">تسجيل الدخول</button>
                <div id="loginError" class="error-message" style="display: none;"></div>
            </form>
        </div>
    </div>
    <script>
        // public/auth.js
const API_URL = window.location.origin;

// Check if user is already logged in
function checkAuth() {
    const token = localStorage.getItem('adminToken');
    if (token) {
        // Verify token with server
        fetch('/api/verify-token', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        }).then(response => {
            if (!response.ok) {
                localStorage.removeItem('adminToken');
                if (window.location.pathname.includes('dashboard.html')) {
                    window.location.href = 'login.html';
                }
            } else if (window.location.pathname.includes('login.html')) {
                window.location.href = 'dashboard.html';
            }
        });
    } else if (window.location.pathname.includes('dashboard.html')) {
        window.location.href = 'login.html';
    }
}

// Handle login form
const loginForm = document.getElementById('loginForm');
if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = data.message || 'خطأ في البريد الإلكتروني أو كلمة المرور';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            errorDiv.textContent = 'حدث خطأ في الاتصال بالخادم';
            errorDiv.style.display = 'block';
        }
    });
}

// Logout function
function logout() {
    localStorage.removeItem('adminToken');
    window.location.href = 'login.html';
}

// Check authentication on page load
checkAuth();
    </script>
</body>
</html>
