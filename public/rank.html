/* public/styles.css */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #f5f5f5 0%, #e8d5b7 100%);

}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #d4a373;
}

::-webkit-scrollbar-thumb {
    background: #8b4513;

}

/* Navbar */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(44, 24, 16, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    padding: 1rem 0;
    transition: all 0.3s ease;
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.logo-text {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-menu a {
    color: #fff;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
}

.nav-menu a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #ffd700;
    transition: width 0.3s;
}

.nav-menu a:hover::after {
    width: 100%;
}

.nav-toggle {
    display: none;
    cursor: pointer;
}

.nav-toggle span {
    display: block;
    width: 25px;
    height: 3px;
    background: #ffd700;
    margin: 5px 0;

}

/* Hero Section */
.hero {

    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');

}

.hero-overlay {

/* Animations */

    from {

        transform: translateY(30px);

    to {

        transform: translateY(0);
    }

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {

    }

<body class="rank-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="https://i.postimg.cc/d0Pfc81d/Logo.jpg" alt="Logo" class="logo-img">
                <span class="logo-text">رحلة في مصر</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home">الرئيسية</a></li>
                <li><a href="index.html#about">نبذة عنا</a></li>
                <li><a href="index.html#tours">الجولات</a></li>
                <li><a href="index.html#gallery">المعرض</a></li>
                <li><a href="rank.html">التقييمات</a></li>
                <li><a href="index.html#contact">اتصل بنا</a></li>
            </ul>
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Rank Section - Add Rating -->
    <section class="rank-section">
        <div class="container">
            <h2 class="section-title">أضف تقييمك</h2>
            <div class="rank-card">
                <form id="rankForm" class="rank-form">
                    <div class="form-group">
                        <label for="rankName">الاسم الكامل</label>
                        <input type="text" id="rankName" placeholder="أدخل اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="rankCountry">الدولة</label>
                        <input type="text" id="rankCountry" placeholder="مثال: مصر، السعودية، إنجلترا" required>
                    </div>
                    <div class="form-group">
                        <label>تقييمك</label>
                        <div class="rating-input">
                            <i class="far fa-star" data-rating="1"></i>
                            <i class="far fa-star" data-rating="2"></i>
                            <i class="far fa-star" data-rating="3"></i>
                            <i class="far fa-star" data-rating="4"></i>
                            <i class="far fa-star" data-rating="5"></i>
                        </div>
                        <input type="hidden" id="rankRating" required>
                    </div>
                    <div class="form-group">
                        <label for="rankMessage">رسالتك</label>
                        <textarea id="rankMessage" rows="4" placeholder="شاركنا تجربتك مع رحلة في مصر..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">إرسال التقييم</button>
                </form>
                <div id="rankMessageSuccess" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </section>

    <!-- Display All Rankings -->
    <section class="rankings-section">
        <div class="container">
            <h2 class="section-title">آراء عملائنا</h2>
            <div class="rankings-filter">
                <button class="filter-btn active" data-filter="all">الكل</button>
                <button class="filter-btn" data-filter="5">★★★★★ (5)</button>
                <button class="filter-btn" data-filter="4">★★★★☆ (4)</button>
                <button class="filter-btn" data-filter="3">★★★☆☆ (3)</button>
            </div>
            <div class="rankings-grid" id="rankingsGrid">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل التقييمات...
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 رحلة في مصر مع سيمون. جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        // public/rank.js
const API_URL = window.location.origin;

// Rating stars functionality
document.addEventListener('DOMContentLoaded', () => {
    const stars = document.querySelectorAll('.rating-input i');
    const ratingInput = document.getElementById('rankRating');

    stars.forEach(star => {
        star.addEventListener('click', function() {
            const rating = this.getAttribute('data-rating');
            ratingInput.value = rating;
            
            // Update stars display
            stars.forEach((s, index) => {
                if (index < rating) {
                    s.className = 'fas fa-star';
                } else {
                    s.className = 'far fa-star';
                }
            });
        });

        star.addEventListener('mouseover', function() {
            const rating = this.getAttribute('data-rating');
            stars.forEach((s, index) => {
                if (index < rating) {
                    s.className = 'fas fa-star';
                } else {
                    s.className = 'far fa-star';
                }
            });
        });

        star.addEventListener('mouseout', function() {
            const currentRating = ratingInput.value;
            stars.forEach((s, index) => {
                if (index < currentRating) {
                    s.className = 'fas fa-star';
                } else {
                    s.className = 'far fa-star';
                }
            });
        });
    });
});

// Load rankings
async function loadRankings() {
    try {
        const response = await fetch('/api/rankings');
        if (response.ok) {
            const rankings = await response.json();
            displayRankings(rankings);
        }
    } catch (error) {
        console.error('Error loading rankings:', error);
    }
}

// Display rankings
function displayRankings(rankings) {
    const grid = document.getElementById('rankingsGrid');
    if (!grid) return;

    if (rankings.length === 0) {
        grid.innerHTML = `
            <div class="empty-rankings">
                <i class="fas fa-comment-dots"></i>
                <h3>لا توجد تقييمات بعد</h3>
                <p>كن أول من يضيف تقييماً!</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = rankings.map(ranking => `
        <div class="ranking-card" data-rating="${ranking.rating}">
            <div class="ranking-header">
                <div class="ranking-user">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <h4>${escapeHtml(ranking.name)}</h4>
                        <span class="country">${escapeHtml(ranking.country)}</span>
                    </div>
                </div>
                <div class="ranking-rating">
                    ${generateStars(ranking.rating)}
                </div>
            </div>
            <div class="ranking-message">
                <i class="fas fa-quote-right"></i>
                <p>${escapeHtml(ranking.message)}</p>
            </div>
            <div class="ranking-date">
                <i class="far fa-calendar-alt"></i>
                <span>${formatDate(ranking.createdAt)}</span>
            </div>
        </div>
    `).join('');
}

// Generate stars HTML
function generateStars(rating) {
    let stars = '';
    for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
            stars += '<i class="fas fa-star"></i>';
        } else {
            stars += '<i class="far fa-star"></i>';
        }
    }
    return stars;
}

// Filter rankings
function setupFilter() {
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.ranking-card');

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Update active button
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.getAttribute('data-filter');
            
            cards.forEach(card => {
                if (filter === 'all') {
                    card.style.display = 'block';
                } else {
                    const rating = card.getAttribute('data-rating');
                    if (rating === filter) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                }
            });
        });
    });
}

// Submit new ranking
const rankForm = document.getElementById('rankForm');
if (rankForm) {
    rankForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('rankName').value;
        const country = document.getElementById('rankCountry').value;
        const rating = document.getElementById('rankRating').value;
        const message = document.getElementById('rankMessage').value;
        const successDiv = document.getElementById('rankMessageSuccess');

        if (!rating) {
            alert('الرجاء اختيار تقييم');
            return;
        }

        const rankingData = {
            name: name,
            country: country,
            rating: parseInt(rating),
            message: message,
            createdAt: new Date().toISOString()
        };

        try {
            const response = await fetch('/api/rankings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(rankingData)
            });

            if (response.ok) {
                successDiv.textContent = 'تم إضافة تقييمك بنجاح! شكراً لك.';
                successDiv.style.display = 'block';
                rankForm.reset();
                // Reset stars
                const stars = document.querySelectorAll('.rating-input i');
                stars.forEach(star => star.className = 'far fa-star');
                document.getElementById('rankRating').value = '';
                
                // Reload rankings after 2 seconds
                setTimeout(() => {
                    successDiv.style.display = 'none';
                    loadRankings();
                }, 2000);
            } else {
                const error = await response.json();
                alert(error.message || 'حدث خطأ في إرسال التقييم');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال بالخادم');
        }
    });
}

// Helper functions
function escapeHtml(str) {
    if (!str) return '';
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatDate(dateString) {
    if (!dateString) return '-';
    const date = new Date(dateString);
    return date.toLocaleDateString('ar-EG', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

// Initialize
loadRankings();
    </script>
</body>
</html>
